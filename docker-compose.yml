services:
  postgres:
    image: postgres:16-alpine
    container_name: mdpcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: niloytalukder
      POSTGRES_PASSWORD: mdpcare_dev_password
      POSTGRES_DB: mdpcare_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U niloytalukder -d mdpcare_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mdpcare-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
